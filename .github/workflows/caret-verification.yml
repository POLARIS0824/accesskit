name: Caret verification

on:
  push:
    branches:
      - codex/caret-ci

permissions:
  contents: read

jobs:
  windows-msvc:
    if: github.repository == 'POLARIS0824/accesskit'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source:
          - 7775f84bb11deee6edeb0ada10017f88d653f0b9
          - 3d7ab31fc7177661bc8a3ead8382a7630612d7e9
        rust: ['1.87.0', stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}-x86_64-pc-windows-msvc
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false

      - name: Install MSVC Rust toolchain
        run: rustup toolchain install "$env:RUSTUP_TOOLCHAIN" --profile minimal

      - name: Record source and compiler
        run: |
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version

      - name: Test Windows text provider
        run: cargo test --locked -p accesskit_windows tests::text -- --test-threads=1 --nocapture

      - name: Test core and consumer
        run: cargo test --locked -p accesskit -p accesskit_consumer
